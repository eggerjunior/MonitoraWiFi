name: Security scan (secrets)

# Varredura de segredos commitados por engano (Seção 2.2/22). Informativo
# nesta fase — endurecer para bloquear o merge antes da Fase 8 (produção).
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
