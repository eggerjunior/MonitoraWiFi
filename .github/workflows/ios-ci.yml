name: iOS CI (build validation)

# Roda em todo push/PR que toque apps/ios/ — pega erro de compilação num
# runner macOS real, sem depender de Mac local (ver skill
# ildemar_ios-native-testflight). Não assina nem publica nada; não precisa de
# secrets.
on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "apps/ios/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -i '^Xcode'
          LATEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$LATEST" ]]; then
            LATEST="/Applications/Xcode.app"
          fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild -project EggerNetworkIntelligence.xcodeproj -scheme EggerNetworkIntelligence \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            GIT_COMMIT="$(git rev-parse --short=8 HEAD)" \
            build

      # Tentativas anteriores (histórico de commits deste arquivo) sempre
      # falhavam com "Could not find test host for
      # EggerNetworkIntelligenceTests" usando build-for-testing +
      # test-without-building em duas fases. Nova hipótese, não testada
      # antes: a ação "test" do scheme não tinha `config: Debug` explícito
      # em project.yml (diferente de "run"/"archive", que já tinham) — o
      # app podia ser buildado numa pasta de produto (config) diferente da
      # que o TEST_HOST resolvido esperava. Corrigido em project.yml;
      # comando de teste simplificado para uma única ação `test` (evita
      # divergência entre as duas fases anteriores).
      - name: Run unit tests
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for d in devices:
                  if d['name'].startswith('iPhone'):
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")"
          if [[ -z "$DEVICE_ID" ]]; then
            echo "::error::Nenhum simulador de iPhone disponível neste runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Usando simulador UDID: $DEVICE_ID"

          xcodebuild -project EggerNetworkIntelligence.xcodeproj -scheme EggerNetworkIntelligence \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            test
