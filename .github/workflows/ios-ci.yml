name: iOS CI (build validation)

# Roda em todo push/PR que toque apps/ios/ — pega erro de compilação num
# runner macOS real, sem depender de Mac local (ver skill
# ildemar_ios-native-testflight). Não assina nem publica nada; não precisa de
# secrets.
on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "apps/ios/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -i '^Xcode'
          LATEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$LATEST" ]]; then
            LATEST="/Applications/Xcode.app"
          fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild -project EggerNetworkIntelligence.xcodeproj -scheme EggerNetworkIntelligence \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            GIT_COMMIT="$(git rev-parse --short=8 HEAD)" \
            build

      # NOTA: execução de testes (xcodebuild test) foi tentada de novo nesta
      # sessão (2026-08-02, duas hipóteses novas: config: Debug explícita no
      # scheme; TEST_HOST/BUNDLE_LOADER declarados manualmente em vez de
      # inferidos) — mesmo erro real das 5 tentativas anteriores persiste:
      # "Could not find test host for EggerNetworkIntelligenceTests: TEST_HOST
      # evaluates to [...]/Debug-iphonesimulator/EggerNetworkIntelligence.app/
      # EggerNetworkIntelligence". Pista nova encontrada desta vez: o log
      # mostra "Using the first of multiple matching destinations" (o mesmo
      # UDID casa com variante arm64 e x86_64 simultaneamente) e o erro
      # acontece na fase de validação do projeto pelo xcodebuild, antes de
      # qualquer compilação — indício de um bug de ordenação do próprio
      # xcodebuild CLI (checa se o TEST_HOST existe antes de buildar o app
      # que o geraria), não algo corrigível por configuração do projeto.
      # Rastreado como pendência real em
      # docs/architecture/07-criterios-aceite-fase1.md — precisa de Xcode
      # real com GUI (⌘U, log de build verboso) pra diagnosticar mais fundo;
      # não repetir tentativas às cegas sem uma hipótese nova.
