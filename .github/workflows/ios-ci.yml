name: iOS CI (build validation)

# Roda em todo push/PR que toque apps/ios/ — pega erro de compilação num
# runner macOS real, sem depender de Mac local (ver skill
# ildemar_ios-native-testflight). Não assina nem publica nada; não precisa de
# secrets.
on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "apps/ios/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -i '^Xcode'
          LATEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [[ -z "$LATEST" ]]; then
            LATEST="/Applications/Xcode.app"
          fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild -project EggerNetworkIntelligence.xcodeproj -scheme EggerNetworkIntelligence \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            GIT_COMMIT="$(git rev-parse --short=8 HEAD)" \
            build

      - name: Run unit tests
        run: |
          set -euo pipefail
          # Seleciona um UDID concreto de simulador de iPhone (não um "name",
          # que pode casar simultaneamente com destino arm64 e x86_64 do mesmo
          # dispositivo e gerar ambiguidade) — evita nome fixo, que quebra
          # sempre que o runner rotaciona o lineup de simuladores disponível.
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for devices in data['devices'].values():
              for d in devices:
                  if d['name'].startswith('iPhone'):
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")"
          if [[ -z "$DEVICE_ID" ]]; then
            echo "::error::Nenhum simulador de iPhone disponível neste runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Usando simulador UDID: $DEVICE_ID"

          # Duas fases (padrão recomendado para CI): build-for-testing builda
          # o app + o bundle de teste explicitamente antes de rodar nada;
          # test-without-building só executa. Mais robusto sob xcodebuild
          # headless do que a ação "test" combinada.
          xcodebuild -project EggerNetworkIntelligence.xcodeproj -scheme EggerNetworkIntelligence \
            -derivedDataPath DerivedData-Test \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            build-for-testing

          xcodebuild -project EggerNetworkIntelligence.xcodeproj -scheme EggerNetworkIntelligence \
            -derivedDataPath DerivedData-Test \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            test-without-building
