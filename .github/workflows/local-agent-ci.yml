name: Local Agent CI (Go)

on:
  push:
    branches: [main]
    paths:
      - "apps/local-agent/**"
      - ".github/workflows/local-agent-ci.yml"
  pull_request:
    paths:
      - "apps/local-agent/**"
  workflow_dispatch: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/local-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/local-agent/go.mod

      - name: Instalar iperf3 (para o teste real do speed test modo LAN)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq iperf3

      - name: Format check (gofmt)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "Arquivos não formatados (rode 'gofmt -w .'):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -cover

  vulnerability-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/local-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/local-agent/go.mod
      - name: govulncheck (informativo — não bloqueia o merge nesta fase)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck encontrou avisos — revisar antes da Fase 8 (produção)"
