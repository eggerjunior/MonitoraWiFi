name: EggerNetworkIntelligence
options:
  bundleIdPrefix: br.app.egger
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  MARKETING_VERSION: "0.1.6"
  CURRENT_PROJECT_VERSION: 7
  GIT_COMMIT: dev # sobrescrito na linha de comando por scripts/testflight.sh
  API_BASE_URL: "https://wifi.egger.app.br/api/v1"

targets:
  EggerNetworkIntelligence:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
      - path: ../../packages/design-tokens/DesignTokens.swift
        optional: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.app.egger.network-intelligence
        PRODUCT_NAME: "Egger Network Intelligence"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        SUPPORTS_MACCATALYST: false
        ENABLE_PREVIEWS: true
        DEVELOPMENT_TEAM: E743636TCJ # Apple Team ID do Ildemar (não secreto, reusado em todos os apps)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Release usa Manual signing com um certificado de distribuição e
      # perfil próprios, reaproveitados em todo run de CI — evita o problema
      # documentado em references/ildemar-ios-release.md da skill
      # ildemar_ios-native-testflight ("Certificados de assinatura
      # esgotados"): Automatic signing cria um certificado novo a cada
      # archive e estoura a cota da conta Apple depois de poucas execuções.
      # Debug continua Automatic (só usado para build de simulador no CI).
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "EggerNetworkIntelligence App Store"
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Egger Network"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GitCommit: "$(GIT_COMMIT)"
        APIBaseURL: "$(API_BASE_URL)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: >-
          Usado para proteger o acesso à sua sessão com Face ID, em vez de manter
          a sessão sempre aberta.
    entitlements:
      path: Sources/Resources/EggerNetworkIntelligence.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)br.app.egger.network-intelligence

  EggerNetworkIntelligenceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests
    dependencies:
      - target: EggerNetworkIntelligence
    settings:
      base:
        SWIFT_VERSION: "6.0"

schemes:
  EggerNetworkIntelligence:
    build:
      targets:
        # Lista explícita de ações — o shorthand "all" não garantiu de forma
        # confiável que o app fosse buildado como pré-requisito da ação de
        # teste (causava "Could not find test host" no xcodebuild headless).
        EggerNetworkIntelligence: [run, test, profile, analyze, archive]
        EggerNetworkIntelligenceTests: [test]
    test:
      targets:
        - EggerNetworkIntelligenceTests
    run:
      config: Debug
    archive:
      config: Release
