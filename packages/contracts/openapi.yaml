        enrollment_token:
          type: string
        hostname:
          type: string
        platform:
          type: string
          enum: [linux_amd64, linux_arm64, macos]
        version:
          type: string

    EnrollAgentResponse:
      type: object
      required: [agent_id, agent_secret, site_id]
      properties:
        agent_id:
          type: string
          format: uuid
        agent_secret:
          type: string
          description: Credencial de longa duração — exibida uma única vez.
        site_id:
          type: string
          format: uuid

    Agent:
      type: object
      required: [id, site_id, hostname, version, platform, auth_method, enrolled_at, revoked]
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        hostname:
          type: string
        version:
          type: string
        platform:
          type: string
        auth_method:
          type: string
          enum: [rotating_credential, mtls]
        enrolled_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean

    AgentPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    AgentHeartbeatRequest:
      type: object
      properties:
        status:
          type: string
          default: ok
        queued_items:
          type: integer
        cpu_pct:
          type: number
          nullable: true
        mem_pct:
          type: number
          nullable: true

    PingTestPayload:
      type: object
      required: [target, protocol, executed_at, idempotency_key]
      properties:
        target:
          type: string
        protocol:
          type: string
          enum: [icmp, tcp, http, dns]
        latency_ms_p50:
          type: number
          nullable: true
        latency_ms_p95:
          type: number
          nullable: true
        latency_ms_p99:
          type: number
          nullable: true
        jitter_ms:
          type: number
          nullable: true
        packet_loss_pct:
          type: number
          nullable: true
        executed_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
          description: Estável entre reenvios do mesmo resultado (Seção 3).

    SpeedTestPayload:
      type: object
      required: [mode, executed_at, idempotency_key]
      properties:
        mode:
          type: string
          enum: [internet, lan, http]
        download_mbps:
          type: number
          nullable: true
        upload_mbps:
          type: number
          nullable: true
        idle_latency_ms:
          type: number
          nullable: true
        loaded_latency_ms:
          type: number
          nullable: true
        bufferbloat_ms:
          type: number
          nullable: true
        jitter_ms:
          type: number
          nullable: true
        executed_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
          description: Estável entre reenvios do mesmo resultado (Seção 3).

    AgentTelemetryRequest:
      type: object
      properties:
        ping_tests:
          type: array
          items:
            $ref: "#/components/schemas/PingTestPayload"
        speed_tests:
          type: array
          items:
            $ref: "#/components/schemas/SpeedTestPayload"

    PingTestPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PingTestPayload"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    SpeedTestPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpeedTestPayload"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    CreateCommandRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [ping, dns_lookup, traceroute, batch_ping, ssl_check, http_request, lan_scan, wake_on_lan, port_scan, dns_resolver_compare]
        params:
          type: object
          description: >
            Formato depende de `type`. "ping": { target: string, protocol?:
            icmp|tcp|http|dns (padrão icmp) }. "dns_lookup": { hostname:
            string }. "traceroute": { target: string }. "batch_ping": {
            targets: string[] (1 a 20 itens), protocol?: icmp|tcp|http|dns
            (padrão icmp) }. "ssl_check": { target: string, port?: integer
            (padrão 443, 1-65535) }. "http_request": { url: string (http ou
            https), method?: GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS (padrão
            GET), headers?: object (string->string), body?: string }.
            "lan_scan": { cidr: string — precisa ser um bloco IPv4 privado
            (RFC 1918) de no máximo /22 (1024 endereços) }. "wake_on_lan": {
            mac_address: string, broadcast_ip?: string (padrão
            255.255.255.255, precisa ser esse valor ou um IPv4 privado),
            port?: integer (padrão 9, 1-65535) }. "port_scan": { target:
            string — precisa ser um IPv4 privado literal (RFC 1918, não
            aceita hostname), start_port: integer, end_port: integer
            (intervalo de no máximo 1024 portas) }. "dns_resolver_compare": {
            hostname: string } — resolve contra uma lista fixa de
            resolvedores (sistema, Cloudflare, Google, Quad9), não
            configurável pelo usuário.

    Command:
      type: object
      required: [id, site_id, agent_id, type, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        type:
          type: string
        params:
          type: object
        status:
          type: string
          enum: [pending, claimed, completed, failed]
        result:
          type: object
          nullable: true
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        claimed_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    CommandList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Command"

    RdapEvent:
      type: object
      properties:
        action:
          type: string
        date:
          type: string
          format: date-time

    RdapResult:
      type: object
      required: [query, server, object_class_name, status, events]
      properties:
        query:
          type: string
        server:
          type: string
          description: URL do servidor RDAP autoritativo que respondeu
        object_class_name:
          type: string
          description: Tipo do objeto RDAP (ex.; "domain", "ip network")
        handle:
          type: string
        name:
          type: string
        status:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/RdapEvent"
        nameservers:
          type: array
          items:
            type: string
        raw:
          type: object
          description: Resposta RDAP completa, para campos não normalizados

    CommandResultRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [completed, failed]
        result:
          type: object
          description: Obrigatório em sentido prático quando status=completed; formato depende do type do comando.
        error:
          type: string
          description: Obrigatório em sentido prático quando status=failed.

    UniFiDevice:
      type: object
      required: [external_id, mac_address, name, model, state]
      properties:
        external_id:
          type: string
          description: id retornado pela Network API local — não é um UUID interno nosso.
        mac_address:
          type: string
        ip_address:
          type: string
        name:
          type: string
        model:
          type: string
        state:
          type: string
          description: "ex.: ONLINE, OFFLINE — valor observado real, não um enum fechado por nós."
        firmware_version:
          type: string
        features:
          type: array
          items:
            type: string
          description: "ex.: accessPoint, switching"
        interfaces:
          type: array
          items:
            type: string
          description: "ex.: radios, ports"
        uplink_device_id:
          type: string
          description: >
            external_id do dispositivo upstream (ex.: o switch a que um AP
            está conectado) — vazio para o dispositivo raiz (gateway).
            Confirmado em 2026-08-02 contra a instalação real (campo
            `uplink.deviceId` de `GET .../devices/{id}` da Network API
            local).

    UniFiDeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UniFiDevice"

    UniFiClient:
      type: object
      required: [external_id, type, mac_address]
      properties:
        external_id:
          type: string
        type:
          type: string
          enum: [WIRED, WIRELESS]
        name:
          type: string
        ip_address:
          type: string
        mac_address:
          type: string
        connected_at:
          type: string
          format: date-time
          nullable: true
        uplink_device_id:
          type: string
          description: external_id do dispositivo UniFi ao qual este cliente está conectado.

    UniFiClientList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UniFiClient"

    Anomaly:
      type: object
      required: [id, metric, observed_at, value, bucket_mean, bucket_size, z_score, detected_at]
      properties:
        id:
          type: string
          format: uuid
        metric:
          type: string
          description: "ex.: ping_latency_ms_p50"
        observed_at:
          type: string
          format: date-time
        value:
          type: number
        bucket_mean:
          type: number
          description: Média histórica do bucket (mesma hora do dia + dia da semana) no momento da detecção.
        bucket_size:
          type: integer
          description: Quantas amostras históricas sustentam esse baseline.
        z_score:
          type: number
          description: Desvios-padrão de distância da média do bucket.
        detected_at:
          type: string
          format: date-time

    AnomalyPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Anomaly"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    Diagnosis:
      type: object
      required: [id, category, summary, confidence, impact, risk, evidence, window_start, window_end, detected_at]
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum: [internet_slow, wifi_slow]
        summary:
          type: string
          description: Frase explicando o diagnóstico em português, com contagem de anomalias e desvio médio.
        confidence:
          type: number
          description: 0–1, cresce com o número de métricas distintas que corroboram o diagnóstico.
        impact:
          type: string
          enum: [low, medium, high]
        risk:
          type: string
          enum: [low, medium, high]
        evidence:
          type: array
          description: Anomalias reais (com anomaly_id rastreável) que sustentam este diagnóstico.
          items:
            type: object
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        detected_at:
          type: string
          format: date-time

    DiagnosisPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Diagnosis"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    Recommendation:
      type: object
      required: [id, diagnosis_id, action, confidence, impact, risk, evidence, created_at]
      properties:
        id:
          type: string
          format: uuid
        diagnosis_id:
          type: string
          format: uuid
          description: Nunca uma recomendação solta — sempre amarrada a um diagnóstico real.
        action:
          type: string
        confidence:
          type: number
        impact:
          type: string
          enum: [low, medium, high]
        risk:
          type: string
          enum: [low, medium, high]
        evidence:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time

    RecommendationPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    Report:
      type: object
      required: [id, site_id, kind, period_start, period_end, generated_at]
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [diagnostics_summary]
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        generated_by:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        content:
          type: object
          description: Só presente em POST /reports e GET /reports/{reportId} — omitido na listagem.

    ReportPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    SpatialSurveySample:
      type: object
      required: [position_x, position_y, position_z, is_expensive, is_constrained, interface_type, captured_at]
      properties:
        position_x:
          type: number
          description: Posição no espaço da sessão ARKit (metros, eixo X), relativa à origem da sessão — não georreferenciada.
        position_y:
          type: number
        position_z:
          type: number
        ssid:
          type: string
          nullable: true
          description: SSID associado no momento da captura (requer permissão de localização no iOS).
        bssid:
          type: string
          nullable: true
        rtt_ms:
          type: number
          nullable: true
          description: Latência round-trip ao backend medida a partir do próprio ponto — nunca um valor de RSSI (indisponível via API pública do iOS).
        is_expensive:
          type: boolean
          description: "NWPathMonitor — caminho de rede \"expensive\" (ex.: hotspot pessoal)."
        is_constrained:
          type: boolean
          description: NWPathMonitor — caminho de rede "constrained" (modo de dados baixo)
        interface_type:
          type: string
          enum: [wifi, cellular, wired, other]
        captured_at:
          type: string
          format: date-time

    CreateSpatialSurveyRequest:
      type: object
      required: [name, device_model, lidar_used, started_at, finished_at, samples]
      properties:
        name:
          type: string
        device_model:
          type: string
          description: "ex.: iPhone15,2 (identificador de modelo, não o marketing name)"
        lidar_used:
          type: boolean
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        samples:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SpatialSurveySample"

    SpatialSurvey:
      type: object
      required: [id, site_id, created_by, name, device_model, lidar_used, started_at, finished_at, sample_count]
      properties:
        id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        name:
          type: string
        device_model:
          type: string
        lidar_used:
          type: boolean
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        sample_count:
          type: integer

    SpatialSurveyDetail:
      allOf:
        - $ref: "#/components/schemas/SpatialSurvey"
        - type: object
          properties:
            samples:
              type: array
              items:
                $ref: "#/components/schemas/SpatialSurveySample"

    SpatialSurveyPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpatialSurvey"
        page:
