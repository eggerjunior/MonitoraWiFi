openapi: 3.1.0
info:
  title: Egger Network Intelligence API
  version: 0.1.0
  description: >
    Contrato único de verdade da API do backend central (ADR-005). SDKs para Swift e
    TypeScript devem ser gerados/derivados desta especificação — nunca escritos em
    paralelo. Escopo desta versão: Fase 1 (Fundação) — autenticação, RBAC,
    organizações, sites e health checks. Endpoints de telemetria, UniFi, testes
    ativos, LiDAR, alertas etc. são adicionados nas fases seguintes sem quebrar esta
    base.
  contact:
    name: Egger Network Intelligence
servers:
  - url: https://api.egger-network-intelligence.example/api/v1
    description: Produção (placeholder — domínio real definido na Fase 8)
  - url: http://localhost:8080/api/v1
    description: Desenvolvimento local (Docker Compose)

tags:
  - name: system
    description: Health checks e observabilidade do próprio backend
  - name: auth
    description: Autenticação e sessão
  - name: organizations
    description: Organizações (tenants)
  - name: sites
    description: Sites dentro de uma organização
  - name: agents
    description: Enrolamento, heartbeat e telemetria do agente local (Fase 2)
  - name: commands
    description: Testes sob demanda disparados pelo usuário e executados pelo agente (Fase 5, início)
  - name: unifi
    description: Inventário UniFi sincronizado pelo agente (Fase 3, início — ADR-007)
  - name: anomalies
    description: Anomalias estatísticas detectadas pelo worker (Fase 7, início)
  - name: diagnoses
    description: >
      Diagnósticos do motor de correlação (Fase 7) — categorias
      internet_slow/wifi_slow, sempre com evidência (anomalias reais),
      confiança, impacto e risco.
  - name: recommendations
    description: >
      Recomendações geradas a partir de um diagnóstico real (Fase 7) — nunca
      uma recomendação solta sem evidência/confiança/impacto/risco.
  - name: reports
    description: >
      Relatórios de diagnóstico gerados sob demanda (Fase 7), agregando
      anomalias/diagnósticos/recomendações reais de um período.
  - name: spatial-surveys
    description: >
      Levantamento espacial (Fase 6, "Spatial WiFi Survey") — posição real
      (ARKit world tracking, hardware com LiDAR) + qualidade de rede medida
      no próprio ponto, capturado pelo app iOS e enviado completo ao final
      da caminhada guiada.

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: Processo está vivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      tags: [system]
      summary: Readiness probe (verifica dependências como banco e Redis)
      operationId: getReadyz
      security: []
      responses:
        "200":
          description: Pronto para receber tráfego
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Uma ou mais dependências indisponíveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"

  /auth/login:
    post:
      tags: [auth]
      summary: Autentica com e-mail e senha
      operationId: postAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      tags: [auth]
      summary: Encerra a sessão atual
      operationId: postAuthLogout
      responses:
        "204":
          description: Sessão encerrada

  /auth/me:
    get:
      tags: [auth]
      summary: Retorna o usuário autenticado e seu papel (RBAC)
      operationId: getAuthMe
      responses:
        "200":
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /organizations:
    get:
      tags: [organizations]
      summary: Lista organizações visíveis ao usuário autenticado
      operationId: listOrganizations
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Lista paginada de organizações
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sites:
    get:
      tags: [sites]
      summary: Lista sites da organização atual
      operationId: listSites
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Lista paginada de sites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SitePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sites/{siteId}:
    get:
      tags: [sites]
      summary: Detalhe de um site
      operationId: getSite
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Site encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /sites/{siteId}/agent-enrollment-tokens:
    post:
      tags: [agents]
      summary: Gera um token de enrolamento de uso único para o agente local do site
      operationId: createAgentEnrollmentToken
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Token gerado (exibido uma única vez)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentEnrollmentTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sites/{siteId}/agents:
    get:
      tags: [agents]
      summary: Lista agentes locais registrados no site
      operationId: listAgents
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Lista paginada de agentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sites/{siteId}/agents/{agentId}/revoke:
    post:
      tags: [agents]
      summary: >
        Revoga a credencial de um agente (Fase 8) — a partir daí, toda
        requisição autenticada com esse agente (heartbeat, telemetria,
        claim de comando) é rejeitada com 401. Não existe "unrevoke": um
        agente revogado precisa ser enrolado de novo com um token novo.
      operationId: revokeAgent
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Agente revogado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Agente não encontrado (ou não pertence a este site)

  /agents/enroll:
    post:
      tags: [agents]
      summary: Troca um token de enrolamento por uma credencial de agente de longa duração
      operationId: enrollAgent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollAgentRequest"
      responses:
        "201":
          description: Agente registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollAgentResponse"
        "401":
          description: Token inválido, expirado ou já usado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /agents/{agentId}/heartbeat:
    post:
      tags: [agents]
      summary: Heartbeat periódico do agente local
      operationId: agentHeartbeat
      security:
        - agentSecret: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentHeartbeatRequest"
      responses:
        "200":
          description: Heartbeat registrado
        "401":
          $ref: "#/components/responses/Unauthorized"

  /agents/{agentId}/telemetry:
    post:
      tags: [agents]
      summary: Envia um lote de resultados de teste (ex.; ping) — idempotente por chave
      operationId: agentTelemetry
      security:
        - agentSecret: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTelemetryRequest"
      responses:
        "202":
          description: Lote aceito (itens com idempotency_key repetida são ignorados)
        "400":
          description: Corpo inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sites/{siteId}/ping-tests:
    get:
      tags: [agents]
      summary: Lista os resultados de ping mais recentes de todos os agentes do site
      operationId: listPingTests
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Lista paginada de resultados de ping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingTestPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sites/{siteId}/commands:
    post:
      tags: [commands]
      summary: >
        Dispara um teste sob demanda (Fase 5, início — "rodar ping agora").
        Enfileirado (Postgres, ver ADR-011) e executado pelo agente ativo do
        site na mesma conexão outbound do heartbeat.
      operationId: createCommand
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommandRequest"
      responses:
        "202":
          description: Comando aceito e enfileirado (status pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "400":
          description: Tipo de comando não suportado ou params inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /commands/{commandId}:
    get:
      tags: [commands]
      summary: Consulta o status/resultado de um comando sob demanda
      operationId: getCommand
      parameters:
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comando encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Command"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /agents/{agentId}/commands:
    get:
      tags: [agents, commands]
      summary: >
        Chamado periodicamente pelo agente para reivindicar comandos
        pendentes endereçados a ele (polling — o agente nunca expõe porta de
        entrada, ADR-001).
      operationId: claimAgentCommands
      security:
        - agentSecret: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Comandos reivindicados (status muda para claimed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandList"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /agents/{agentId}/commands/{commandId}/result:
    post:
      tags: [agents, commands]
      summary: Reporta o resultado (ou falha) de um comando reivindicado pelo próprio agente
      operationId: reportCommandResult
      security:
        - agentSecret: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandResultRequest"
      responses:
        "200":
          description: Resultado registrado
        "400":
          description: status inválido (deve ser completed ou failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Comando não pertence a este agente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"

  /sites/{siteId}/speed-tests:
    get:
      tags: [agents]
      summary: Lista os resultados de speed test mais recentes de todos os agentes do site
      operationId: listSpeedTests
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Lista paginada de resultados de speed test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeedTestPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sites/{siteId}/unifi/devices:
    get:
      tags: [unifi]
      summary: >
        Lista o inventário de dispositivos UniFi do site (Fase 3, início —
        ADR-007). Estado atual sincronizado pelo agente, não série temporal.
      operationId: listUniFiDevices
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Inventário de dispositivos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniFiDeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sites/{siteId}/unifi/clients:
    get:
      tags: [unifi]
      summary: Lista os clientes conectados conhecidos pelo UniFi no site
      operationId: listUniFiClients
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniFiClientList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sites/{siteId}/anomalies:
    get:
      tags: [anomalies]
      summary: >
        Lista anomalias estatísticas detectadas (Fase 7, início) — calculadas
        pelo worker (baseline por hora/dia da semana), nunca geradas sem
        histórico suficiente naquele bucket.
      operationId: listAnomalies
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Lista paginada de anomalias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sites/{siteId}/diagnoses:
    get:
      tags: [diagnoses]
      summary: >
        Lista diagnósticos do motor de correlação (Fase 7) — calculados pelo
        worker a partir de anomalias reais, nunca gerados sem evidência.
      operationId: listDiagnoses
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Lista paginada de diagnósticos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosisPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sites/{siteId}/recommendations:
    get:
      tags: [recommendations]
      summary: >
        Lista recomendações (Fase 7) — cada uma amarrada a um diagnóstico
        real (diagnosis_id), com evidência/confiança/impacto/risco.
      operationId: listRecommendations
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Lista paginada de recomendações
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /sites/{siteId}/reports:
    post:
      tags: [reports]
      summary: >
        Gera um relatório sob demanda (Fase 7), agregando anomalias/
        diagnósticos/recomendações reais do período — sem período informado,
        usa os últimos 7 dias. Requer a permissão "Exportar dados".
      operationId: createReport
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                period_start:
                  type: string
                  format: date-time
                period_end:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Relatório gerado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: period_start/period_end inválidos
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [reports]
      summary: Lista relatórios já gerados do site (sem o conteúdo completo — ver GET /reports/{reportId}).
      operationId: listReports
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Lista paginada de relatórios (sem content)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/{reportId}:
    get:
      tags: [reports]
      summary: Busca um relatório com o conteúdo completo.
      operationId: getReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Relatório com conteúdo completo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Relatório não encontrado

  /sites/{siteId}/spatial-surveys:
    post:
      tags: [spatial-surveys]
      summary: >
        Cria um levantamento espacial completo (metadados + todas as
        amostras) — enviado de uma vez pelo app iOS ao final da captura
        guiada, não incrementalmente.
      operationId: createSpatialSurvey
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSpatialSurveyRequest"
      responses:
        "201":
          description: Levantamento criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpatialSurvey"
        "400":
          description: Corpo inválido (nome/device_model ausente, sem amostras, interface_type inválido, datas fora de RFC3339)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [spatial-surveys]
      summary: Lista levantamentos do site (sem amostras — só metadados).
      operationId: listSpatialSurveys
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Lista paginada de levantamentos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpatialSurveyPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /spatial-surveys/{surveyId}:
    get:
      tags: [spatial-surveys]
      summary: Detalhe de um levantamento, incluindo todas as amostras.
      operationId: getSpatialSurvey
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Levantamento com amostras
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpatialSurveyDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Levantamento não encontrado

  /rdap/lookup:
    get:
      tags: [commands]
      summary: >
        Consulta RDAP/WHOIS (Fase 5) para um domínio ou IP — resolvida via
        bootstrap real da IANA (RFC 7484). Roda direto no backend, sem
        envolver o agente do site (a informação é pública da internet, não
        da LAN do usuário).
      operationId: rdapLookup
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
          description: Domínio (ex.; example.com) ou endereço IP
      responses:
        "200":
          description: Resultado RDAP normalizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RdapResult"
        "400":
          description: Parâmetro query ausente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Nenhum servidor RDAP autoritativo encontrado para a consulta
        "429":
          description: Muitas consultas RDAP em pouco tempo
        "502":
          description: Erro ao consultar o servidor RDAP autoritativo

  /agents/{agentId}/unifi-inventory:
    post:
      tags: [agents, unifi]
      summary: >
        Recebido do agente (nunca chamado pelo backend ao console UniFi
        diretamente — ADR-001). Substitui todo o inventário anterior do
        site do agente.
      operationId: sendUniFiInventory
      security:
        - agentSecret: []
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                devices:
                  type: array
                  items:
                    $ref: "#/components/schemas/UniFiDevice"
                clients:
                  type: array
                  items:
                    $ref: "#/components/schemas/UniFiClient"
      responses:
        "200":
          description: Inventário substituído
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Autenticado, mas sem permissão (RBAC)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Limite de requisições excedido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: "Estado do recurso impede a operação (ex.: nenhum agente ativo no site)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: egger_session
    agentSecret:
      type: http
      scheme: bearer
      description: >
        Credencial opaca do agente local, emitida uma única vez por
        /agents/enroll (ADR-006). Nunca é o mesmo token de sessão de usuário.

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ReadyStatus:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, degraded, unavailable]

    ApiError:
      type: object
      required: [error, message, correlation_id]
      properties:
        error:
          type: string
          description: Código de erro estável, legível por máquina
        message:
          type: string
          description: Mensagem legível por humano, segura para exibir na UI
        correlation_id:
          type: string
          format: uuid

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password

    Role:
      type: string
      enum: [owner, administrator, operator, viewer, auditor]
      description: Papéis RBAC (Seção 18) — em ordem decrescente de privilégio

    User:
      type: object
      required: [id, organization_id, email, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        mfa_enrolled:
          type: boolean
        created_at:
          type: string
          format: date-time

    AuthSession:
      type: object
      required: [user, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        expires_at:
          type: string
          format: date-time

    Organization:
      type: object
      required: [id, name, plan_tier, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan_tier:
          type: string
        created_at:
          type: string
          format: date-time

    OrganizationPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    Site:
      type: object
      required: [id, organization_id, name, timezone, created_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        timezone:
          type: string
          description: Fuso IANA (ex. America/Sao_Paulo), usado para exibir horários localmente
        created_at:
          type: string
          format: date-time

    SitePage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Site"
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    AgentEnrollmentTokenResponse:
      type: object
      required: [enrollment_token, site_id, expires_at]
      properties:
        enrollment_token:
          type: string
          description: Exibido uma única vez — não recuperável depois.
        site_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time

    EnrollAgentRequest:
      type: object
      required: [enrollment_token, hostname, platform]
