# Compose de produção — registra como o deploy de wifi.egger.app.br foi feito
# (DEPLOYMENT_STANDARD.md: "Um deploy registra repositório, commit, versão,
# data, artefato e health check"). Este arquivo documenta a topologia; o
# primeiro deploy real (2026-08-01) foi feito com `docker run` equivalentes a
# isto, não com `docker compose` (o host não tem o plugin `docker compose`
# nem `docker-compose` instalado) — ver docs/development-handoff/RELEASE_LOG.md
# para os comandos exatos executados.
#
# Convenções de path (DEPLOYMENT_STANDARD.md):
#   - Env real: /opt/apps/monitorawifi/.env (nunca commitado)
#   - Dados persistentes: /opt/data/monitorawifi/
#   - Serviços escutam em 127.0.0.1; TLS/exposição pública ficam no Hestia/nginx
#     (wifi.egger.app.br -> 127.0.0.1:8421, ver
#     /home/eggerjunior/conf/web/wifi.egger.app.br/nginx*.conf)
name: monitorawifi-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: /opt/apps/monitorawifi/.env
    volumes:
      - /opt/data/monitorawifi/postgres:/var/lib/postgresql/data
    networks: [monitorawifi_net]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: monitorawifi-api:latest
    restart: unless-stopped
    env_file: /opt/apps/monitorawifi/.env
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: "production"
      OTEL_SERVICE_NAME: "egger-api"
      SESSION_TTL_HOURS: "168"
    depends_on: [postgres]
    networks: [monitorawifi_net]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: monitorawifi-web:latest
    restart: unless-stopped
    environment:
      API_BASE_URL: "http://monitorawifi-api:8080/api/v1"
      NODE_ENV: "production"
    ports:
      - "127.0.0.1:8421:3000"
    depends_on: [api]
    networks: [monitorawifi_net]

networks:
  monitorawifi_net:
    name: monitorawifi_net
